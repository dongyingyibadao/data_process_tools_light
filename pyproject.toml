[project]
name = "data-autopro-tools-light"
version = "1.0.0"
description = "Index-free Episode trimming workbench"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "playwright>=1.55,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
