[project]
name = "data-autopro-tools-light"
version = "1.0.0"
description = "Index-free Episode trimming workbench"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "pyarrow>=16,<26",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
data-autopro-light = "lightworkbench.cli:main"

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "playwright>=1.55,<2"]
lerobot = [
    "av==15.1.0",
    "numpy>=2.0,<2.3",
    "opencv-python-headless>=4.9,<4.14",
    "scipy>=1.14,<2",
    "lerobot[dataset] @ git+https://github.com/huggingface/lerobot.git@adccdea1cfbec83ed98263feb7e59f7d047c5692",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
